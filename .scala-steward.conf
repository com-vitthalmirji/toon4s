# Scala Steward (https://github.com/scala-steward-org/scala-steward) configuration.
# Documentation: https://github.com/scala-steward-org/scala-steward/blob/main/docs/repo-specific-configuration.md

# One batch of update pull requests a week at most.
pullRequests.frequency = "7 days"

updates.pin = [
  # Scala 3 stays on the 3.3.x LTS line: a Scala Next release would raise the minimum Scala 3 version
  # of every downstream user, since they could no longer read our TASTy.
  { groupId = "org.scala-lang", artifactId = "scala3-library", version = "3.3." },
  # The default build compiles spark-integration against Spark 3.5.x; CI's spark-compat job checks the
  # other supported lines with -Dtoon4s.spark.version, so the default is not moved to a new major.
  { groupId = "org.apache.spark", version = "3.5." }
]
